[project]
name = "managing-long-task-context"
version = "1.1.0"
description = "Context Strict library for a shared factual ledger in long multi-agent tasks"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
