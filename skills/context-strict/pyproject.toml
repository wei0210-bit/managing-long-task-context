[project]
name = "managing-long-task-context"
version = "0.8.5"
description = "Prime Agent Python-backed skill for fact-grounded context control in long multi-agent tasks"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
